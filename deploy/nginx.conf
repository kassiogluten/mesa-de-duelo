map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Relatos de jogadores (POST /api/relatos): até 3 por minuto por IP, com rajada de 2. Este arquivo entra no
# bloco http {} do nginx (conf.d), então a zona pode ser declarada aqui.
limit_req_zone $binary_remote_addr zone=relatos:1m rate=3r/m;
# Situação dos relatos (Meus relatos, POST /api/relatos/situacao): cada aba pergunta ao abrir a mesa e ao abrir a lista;
# várias abas atrás do mesmo IP cabem.
limit_req_zone $binary_remote_addr zone=relatos_situacao:1m rate=30r/m;
# Área de admin: folga para a página, mas não para tentar senhas (a ponte também bloqueia após 5 erros em 15 min).
limit_req_zone $binary_remote_addr zone=admin:1m rate=60r/m;
# Contagem de quem começa a jogar (POST /api/funil): cada aba manda no máximo 4 eventos; a ponte limita de novo.
limit_req_zone $binary_remote_addr zone=funil:1m rate=10r/m;
# Aviso do servidor: cada aba pergunta a cada 2 minutos; várias abas atrás do mesmo IP (casa, escola) cabem.
limit_req_zone $binary_remote_addr zone=aviso:1m rate=30r/m;
# Contas (Entrar com Google e sincronia dos decks): várias abas e aparelhos atrás do mesmo IP. A ponte limita os logins.
limit_req_zone $binary_remote_addr zone=conta:1m rate=120r/m;
# Conexões com a ponte: folga para recarregar, abrir várias abas e reconectar quando a rede cai, mas não para
# abrir conexões sem parar. Ninguém joga com mais de 30 conexões abertas do mesmo IP.
limit_req_zone $binary_remote_addr zone=ws:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ws_open:1m;
# Dados das cartas (POST /api/cartas, CardDataCache na ponte): cada mesa aberta pede as cartas dos decks dos dois lados,
# em lotes de até 200. A ponte só vai ao Scryfall pelo que ainda não guardou, numa fila só.
limit_req_zone $binary_remote_addr zone=cartas:1m rate=60r/m;
# Imagens das cartas (/scryfall/, ROADMAP item 10): cópia em disco das imagens de cards.scryfall.io que alguém já
# pediu, sem pré-carga. Até 5 GB; a que fica 90 dias sem ser pedida sai, e com o disco cheio saem as menos usadas.
proxy_cache_path /var/cache/nginx/scryfall levels=1:2 keys_zone=scryfall:20m max_size=5g inactive=90d use_temp_path=off;
# Uma mesa nova pede uma centena de imagens de uma vez, e o construtor de decks mostra até 175 por busca.
limit_req_zone $binary_remote_addr zone=imagens:2m rate=30r/s;

# Prévia do link (Open Graph em index.html): a imagem precisa do endereço completo, com o domínio de quem pediu. O
# Coolify termina o HTTPS no proxy, que avisa em X-Forwarded-Proto.
map $http_x_forwarded_proto $mesa_proto {
  default $scheme;
  "~^https" https;
  "~^http"  http;
}
# Convite (?sala=CÓDIGO): só letras e números entram no texto, nada de HTML vindo do endereço.
map $arg_sala $mesa_og_title {
  default "Mesa de Duelo";
  "~^(?<sala>[A-Za-z0-9]{3,12})$" "Convite para a sala $sala · Mesa de Duelo";
}
map $arg_sala $mesa_og_description {
  default "Partidas de Magic contra o computador ou com amigos, direto no navegador.";
  "~^[A-Za-z0-9]{3,12}$" "Você foi chamado para uma partida de Magic. Toque para entrar na sala e jogar, direto no navegador.";
}

server {
  listen 80;
  # O HTTPS termina antes deste nginx: um redirecionamento com endereço completo sairia com http:// e o navegador o
  # bloquearia (o service worker deixava de instalar ao buscar /sobre.html). Sem esquema nem domínio, ele vale como https.
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Só as páginas HTML passam pela troca (sub_filter_types tem text/html por padrão).
  sub_filter_once off;
  # robots.txt e sitemap.xml também levam o endereço completo.
  sub_filter_types text/plain text/xml application/xml;
  sub_filter 'https://__MESA_HOST__' '$mesa_proto://$host';
  sub_filter '<meta property="og:title" content="Mesa de Duelo">' '<meta property="og:title" content="$mesa_og_title">';
  sub_filter '<meta property="og:description" content="Partidas de Magic contra o computador ou com amigos, direto no navegador.">' '<meta property="og:description" content="$mesa_og_description">';

  # A ponte também limita, por IP, as buscas de sala com código errado.
  location ^~ /ws {
    limit_req zone=ws burst=20 nodelay;
    limit_conn ws_open 30;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://bridge:7171/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # A ponte limita de novo (10 por hora por IP) e só usa o IP como resumo em memória, para esse limite.
  location = /api/relatos {
    limit_req zone=relatos burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    proxy_pass http://bridge:7171/api/relatos;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Meus relatos: o andamento e a resposta dos relatos do jogador. Sem este bloco, o POST caía nos arquivos do site (405).
  location = /api/relatos/situacao {
    limit_req zone=relatos_situacao burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://bridge:7171/api/relatos/situacao;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # Quantos visitantes começam a jogar (item 109): só contadores por semana, sem nada do jogador.
  location = /api/funil {
    limit_req zone=funil burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://bridge:7171/api/funil;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
  }

  # Aviso do servidor (manutenção): a tela inicial pergunta a cada 2 minutos; a resposta é um JSON pequeno.
  location = /api/aviso {
    limit_req zone=aviso burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://bridge:7171/api/aviso;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
  }

  # A resposta é JSON (até ~600 KB com 200 cartas): comprimida aqui. A ponte espera o Scryfall até 20 s.
  location = /api/cartas {
    limit_req zone=cartas burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    proxy_pass http://bridge:7171/api/cartas;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # Área de admin (senha em MESA_ADMIN_PASSWORD na ponte). A página fica em /admin.html.
  location ^~ /api/admin/ {
    limit_req zone=admin burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Contas dos jogadores (MESA_GOOGLE_CLIENT_ID na ponte). Só a sincronia dos decks manda corpo grande (a ponte
  # aceita até 4 MB nela e 64 KB no resto).
  location ^~ /api/conta/ {
    limit_req zone=conta burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 4m;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Torneios presenciais: quem só olha atualiza a página a cada 20 s; só o organizador (conta) escreve.
  location ^~ /api/torneios/ {
    limit_req zone=conta burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Página de apresentação (sobre.html), com endereço curto.
  location = /sobre {
    add_header Cache-Control "no-cache";
    try_files /sobre.html =404;
  }
  location = /sobre.html {
    return 301 /sobre;
  }

  location = /admin {
    return 302 /admin.html;
  }

  # As outras páginas do site, com endereço sem .html. Os endereços antigos (links guardados, buscadores) levam ao novo,
  # com os parâmetros (?id= do torneio e do Rever partida); o #trecho segue sozinho no navegador. Ficam antes da regra
  # dos arquivos com extensão, mais abaixo: das regex, vale a primeira que bate.
  location ~ ^/(salas|partidas|torneios|contador|rever|novidades|privacidade|vincular|baixar)\.html$ {
    return 301 /$1$is_args$args;
  }
  location ~ ^/(salas|partidas|torneios|contador|rever|novidades|privacidade|vincular|baixar)$ {
    add_header Cache-Control "no-cache";
    try_files /$1.html =404;
  }

  # Laboratório de efeitos aberto a todos (menu ⋯), com endereço curto: a mesma página de teste, mas nos buscadores.
  location = /efeitos {
    add_header Cache-Control "no-cache";
    try_files /tests/fixtures/effects-lab.html =404;
  }

  # Página de admin e páginas de teste da mesa: sempre da versão publicada e fora dos buscadores.
  location = /admin.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }
  location ^~ /tests/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  # Imagens das cartas pelo nosso cache, no próprio site ou no host das imagens (img.mesao.online, com a Cloudflare na
  # frente, que chega a este mesmo nginx): /scryfall/<tamanho>/<face>/a/b/<id>.jpg é o mesmo caminho de cards.scryfall.io
  # (src/scryfallMirror.ts). Só os tamanhos da mesa e ids do Scryfall: qualquer outro caminho cai no 404 lá embaixo, e
  # isto não vira um proxy aberto. Cada imagem é buscada uma vez só (lock), mesmo com várias mesas pedindo juntas; se o
  # Scryfall falhar, a cópia guardada continua valendo. A CDN guarda na frente pelo Cache-Control de um ano.
  location ~ "^/scryfall/(small|normal|art_crop)/(front|back)/[0-9a-f]/[0-9a-f]/[0-9a-f-]{36}\.jpg$" {
    limit_req zone=imagens burst=300 nodelay;
    limit_req_status 429;
    # O DNS do Docker: com o nome numa variável, o nginx sobe mesmo sem internet e não guarda o IP para sempre.
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $scryfall_host cards.scryfall.io;
    rewrite ^/scryfall(/.*)$ $1 break;
    proxy_pass https://$scryfall_host;
    proxy_ssl_server_name on;
    proxy_ssl_name cards.scryfall.io;
    proxy_http_version 1.1;
    proxy_set_header Host cards.scryfall.io;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header User-Agent "MesaDeDuelo/1.0 (cache de imagens)";
    proxy_set_header Accept "image/*";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    proxy_cache scryfall;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 10m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    # O Scryfall manda os seus; o nosso vai embaixo, e dois Access-Control-Allow-Origin o navegador recusa.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    # Só nas respostas de sucesso (sem "always"): um 404 ou 502 não fica guardado um ano no aparelho nem na CDN.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache $upstream_cache_status always;
    # As imagens vêm de outro host (img.…, a CDN), e o voo da carta na GPU e a cor do tapete leem os pixels.
    add_header Access-Control-Allow-Origin "*" always;
  }

  # Fichas e terrenos da série Nyx pela série e número (/scryfall/cards/<tamanho>/<série>/<número>[/back],
  # src/scryfallMirror.ts): no Scryfall esse endereço é um redirecionamento da API para a imagem em cards.scryfall.io.
  # Guardado no mesmo cache, pelo nosso endereço; numa falta, quem busca é a rota interna abaixo, que segue o
  # redirecionamento, e a API é pedida uma vez só por imagem.
  location ~ "^/scryfall/cards/(?<tok_ver>small|normal|art_crop)/(?<tok_set>[a-z0-9]{2,8})/(?<tok_cn>[0-9A-Za-z-]{1,12})(?<tok_back>/back)?$" {
    limit_req zone=imagens burst=300 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:80/scryfall-api/$tok_ver/$tok_set/$tok_cn$tok_back;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    proxy_cache scryfall;
    proxy_cache_key $uri;
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 10m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache $upstream_cache_status always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  # Só para a rota acima (o próprio nginx, em 127.0.0.1): pede a imagem à API e segue o redirecionamento.
  location ~ "^/scryfall-api/(?<api_ver>small|normal|art_crop)/(?<api_set>[a-z0-9]{2,8})/(?<api_cn>[0-9A-Za-z-]{1,12})(?<api_back>/back)?$" {
    allow 127.0.0.1;
    deny all;
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $api_face "";
    if ($api_back) { set $api_face "&face=back"; }
    set $scryfall_api api.scryfall.com;
    proxy_pass https://$scryfall_api/cards/$api_set/$api_cn?format=image&version=$api_ver$api_face;
    proxy_ssl_server_name on;
    proxy_ssl_name api.scryfall.com;
    proxy_http_version 1.1;
    # Nada do pedido do jogador segue para o Scryfall, só os cabeçalhos daqui: com o CF-Connecting-IP que a Cloudflare
    # põe, a API responde 403 a toda ficha.
    proxy_pass_request_headers off;
    proxy_set_header Host api.scryfall.com;
    proxy_set_header Connection "";
    proxy_set_header User-Agent "MesaDeDuelo/1.0 (cache de imagens)";
    proxy_set_header Accept "*/*";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @scryfall_api_image;
  }

  # O destino do redirecionamento, só se for uma imagem de cards.scryfall.io: isto não vira um proxy aberto.
  location @scryfall_api_image {
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $api_image $upstream_http_location;
    if ($api_image !~ "^https://cards\.scryfall\.io/(small|normal|art_crop)/(front|back)/[0-9a-f]/[0-9a-f]/[0-9a-f-]{36}\.jpg(\?[0-9]+)?$") { return 502; }
    proxy_pass $api_image;
    proxy_ssl_server_name on;
    proxy_ssl_name cards.scryfall.io;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host cards.scryfall.io;
    proxy_set_header Connection "";
    proxy_set_header User-Agent "MesaDeDuelo/1.0 (cache de imagens)";
    proxy_set_header Accept "image/*";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # Scripts e estilos com o hash no nome: nunca mudam. Um que não existe (de uma versão antiga) responde 404, e não a
  # tela do jogo, que o navegador recusaria como script.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location ^~ /ferramentas/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Mesa no PC (godot-table/): o atualizador sempre confere o manifesto; o pacote tem a versão no nome e nunca muda.
  location = /mesa-pc/versao.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # O zip que o jogador baixa tem nome fixo (o link da página /baixar não muda) e é refeito a cada deploy: o navegador
  # sempre confere com o servidor (ETag) e salva como arquivo.
  location = /mesa-pc/mesa-de-duelo-pc.zip {
    add_header Cache-Control "no-cache";
    add_header Content-Disposition 'attachment; filename="mesa-de-duelo-pc.zip"';
    try_files $uri =404;
  }
  location ^~ /mesa-pc/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O service worker (e o script de avisos que ele carrega) e o manifest decidem quando há versão nova: o navegador
  # sempre confere com o servidor.
  location ~ ^/(sw\.js|sw-avisos\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Outros arquivos (imagens, sons, ícones, robots.txt, sitemap.xml): o que não existe responde 404.
  location ~ \.[a-z0-9]+$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Páginas: o arquivo ou, para os outros endereços, a tela do jogo: as telas do app (/decks, /decks/<deck>,
  # /mesa-livre, /laboratorio, /partida, src/app/router.ts) e os convites (?sala=…).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
