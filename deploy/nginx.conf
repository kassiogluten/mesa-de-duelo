map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Relatos de jogadores (POST /api/relatos): até 3 por minuto por IP, com rajada de 2. Este arquivo entra no
# bloco http {} do nginx (conf.d), então a zona pode ser declarada aqui.
limit_req_zone $binary_remote_addr zone=relatos:1m rate=3r/m;
# Área de admin: folga para a página, mas não para tentar senhas (a ponte também bloqueia após 5 erros em 15 min).
limit_req_zone $binary_remote_addr zone=admin:1m rate=60r/m;
# Conexões com a ponte: folga para recarregar, abrir várias abas e reconectar quando a rede cai, mas não para
# abrir conexões sem parar. Ninguém joga com mais de 30 conexões abertas do mesmo IP.
limit_req_zone $binary_remote_addr zone=ws:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ws_open:1m;

server {
  listen 80;
  root /usr/share/nginx/html;

  # A ponte também limita, por IP, as buscas de sala com código errado.
  location /ws {
    limit_req zone=ws burst=20 nodelay;
    limit_conn ws_open 30;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://bridge:7171/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # A ponte limita de novo (10 por hora por IP) e só usa o IP como resumo em memória, para esse limite.
  location = /api/relatos {
    limit_req zone=relatos burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    proxy_pass http://bridge:7171/api/relatos;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Área de admin (senha em MESA_ADMIN_PASSWORD na ponte). A página fica em /admin.html.
  location /api/admin/ {
    limit_req zone=admin burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location = /admin {
    return 302 /admin.html;
  }

  # Página de admin e páginas de teste da mesa: sempre da versão publicada e fora dos buscadores.
  location ~ ^/(admin\.html|tests/) {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O service worker e o manifest decidem quando há versão nova: o navegador sempre confere com o servidor.
  location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
