map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Relatos de jogadores (POST /api/relatos): até 3 por minuto por IP, com rajada de 2. Este arquivo entra no
# bloco http {} do nginx (conf.d), então a zona pode ser declarada aqui.
limit_req_zone $binary_remote_addr zone=relatos:1m rate=3r/m;
# Área de admin: folga para a página, mas não para tentar senhas (a ponte também bloqueia após 5 erros em 15 min).
limit_req_zone $binary_remote_addr zone=admin:1m rate=60r/m;
# Contas (Entrar com Google e sincronia dos decks): várias abas e aparelhos atrás do mesmo IP. A ponte limita os logins.
limit_req_zone $binary_remote_addr zone=conta:1m rate=120r/m;
# Conexões com a ponte: folga para recarregar, abrir várias abas e reconectar quando a rede cai, mas não para
# abrir conexões sem parar. Ninguém joga com mais de 30 conexões abertas do mesmo IP.
limit_req_zone $binary_remote_addr zone=ws:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ws_open:1m;

# Prévia do link (Open Graph em index.html): a imagem precisa do endereço completo, com o domínio de quem pediu. O
# Coolify termina o HTTPS no proxy, que avisa em X-Forwarded-Proto.
map $http_x_forwarded_proto $mesa_proto {
  default $scheme;
  "~^https" https;
  "~^http"  http;
}
# Convite (?sala=CÓDIGO): só letras e números entram no texto, nada de HTML vindo do endereço.
map $arg_sala $mesa_og_title {
  default "Mesa de Duelo";
  "~^(?<sala>[A-Za-z0-9]{3,12})$" "Convite para a sala $sala · Mesa de Duelo";
}
map $arg_sala $mesa_og_description {
  default "Partidas de Magic contra o computador ou com amigos, direto no navegador.";
  "~^[A-Za-z0-9]{3,12}$" "Você foi chamado para uma partida de Magic. Toque para entrar na sala e jogar, direto no navegador.";
}

server {
  listen 80;
  # O HTTPS termina antes deste nginx: um redirecionamento com endereço completo sairia com http:// e o navegador o
  # bloquearia (o service worker deixava de instalar ao buscar /sobre.html). Sem esquema nem domínio, ele vale como https.
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Só as páginas HTML passam pela troca (sub_filter_types tem text/html por padrão).
  sub_filter_once off;
  # robots.txt e sitemap.xml também levam o endereço completo.
  sub_filter_types text/plain text/xml application/xml;
  sub_filter 'https://__MESA_HOST__' '$mesa_proto://$host';
  sub_filter '<meta property="og:title" content="Mesa de Duelo">' '<meta property="og:title" content="$mesa_og_title">';
  sub_filter '<meta property="og:description" content="Partidas de Magic contra o computador ou com amigos, direto no navegador.">' '<meta property="og:description" content="$mesa_og_description">';

  # A ponte também limita, por IP, as buscas de sala com código errado.
  location ^~ /ws {
    limit_req zone=ws burst=20 nodelay;
    limit_conn ws_open 30;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://bridge:7171/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # A ponte limita de novo (10 por hora por IP) e só usa o IP como resumo em memória, para esse limite.
  location = /api/relatos {
    limit_req zone=relatos burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    proxy_pass http://bridge:7171/api/relatos;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Área de admin (senha em MESA_ADMIN_PASSWORD na ponte). A página fica em /admin.html.
  location ^~ /api/admin/ {
    limit_req zone=admin burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Contas dos jogadores (MESA_GOOGLE_CLIENT_ID na ponte). Só a sincronia dos decks manda corpo grande (a ponte
  # aceita até 4 MB nela e 64 KB no resto).
  location ^~ /api/conta/ {
    limit_req zone=conta burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 4m;
    proxy_pass http://bridge:7171;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Página de apresentação (sobre.html), com endereço curto.
  location = /sobre {
    add_header Cache-Control "no-cache";
    try_files /sobre.html =404;
  }
  location = /sobre.html {
    return 301 /sobre;
  }

  location = /admin {
    return 302 /admin.html;
  }

  # Página de admin e páginas de teste da mesa: sempre da versão publicada e fora dos buscadores.
  location = /admin.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }
  location ^~ /tests/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  # Scripts e estilos com o hash no nome: nunca mudam. Um que não existe (de uma versão antiga) responde 404, e não a
  # tela do jogo, que o navegador recusaria como script.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location ^~ /ferramentas/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O service worker (e o script de avisos que ele carrega) e o manifest decidem quando há versão nova: o navegador
  # sempre confere com o servidor.
  location ~ ^/(sw\.js|sw-avisos\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Outros arquivos (imagens, sons, ícones, robots.txt, sitemap.xml): o que não existe responde 404.
  location ~ \.[a-z0-9]+$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Páginas: o arquivo ou, para os outros endereços (convites ?sala=…), a tela do jogo.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
