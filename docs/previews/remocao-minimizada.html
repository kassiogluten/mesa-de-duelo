<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remoção minimizada</title>
<style>
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, system-ui, sans-serif); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .controls .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .controls .lbl { color: var(--muted-foreground, #737373); margin-right: 2px; }
  .controls button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: calc(var(--radius, 8px) - 2px); border: 1px solid var(--border, #e5e5e5); background: var(--card, #fff); color: var(--card-foreground, #171717); cursor: pointer; }
  .controls button:hover { background: var(--accent, #f5f5f5); color: var(--accent-foreground, #171717); }
  .controls button.on { background: var(--primary, #171717); color: var(--primary-foreground, #fafafa); border-color: transparent; }
  .note { font-size: 12.5px; color: var(--muted-foreground, #737373); margin: 10px 2px 0; line-height: 1.5; }

  /* ---- Mesa (paleta fixa da Mesa de Duelo) ---- */
  .mesa { --gold: #f2b54c; --gold-light: #ffe2a0; --ink: #eef1f8; --muted: #9aa5bb; --line: rgb(242 181 76 / .28); --panel: rgb(9 13 24 / .9); --red: #e2574c;
    position: relative; height: 560px; border-radius: 12px; overflow: hidden; color: var(--ink); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 45%, #1b2a44 0%, #0d1526 55%, #060912 100%); isolation: isolate; }
  .seat { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .seat.opp { top: 52px; } .seat.me { bottom: 96px; }
  .tag { position: absolute; left: 18px; font: 600 12px/1 'Outfit', system-ui; color: var(--muted); letter-spacing: .03em; display: flex; gap: 8px; align-items: center; }
  .tag b { color: var(--ink); font-weight: 600; }
  .tag .life { background: rgb(255 255 255 / .08); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--gold-light); }
  .tag.opp { top: 16px; } .tag.me { bottom: 64px; }
  .hand { position: absolute; bottom: -38px; left: 50%; transform: translateX(-50%); display: flex; }
  .hand .card { margin: 0 -10px; transform: rotate(var(--r)); }
  .action { position: absolute; right: 16px; bottom: 16px; width: 200px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 22px rgb(0 0 0 / .5); font-size: 12px; color: var(--muted); }
  .action strong { display: block; color: var(--ink); font: 600 13px/1.3 'Outfit', system-ui; margin-bottom: 8px; }
  .abtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 16px; font: 700 13px/1 'Outfit', system-ui; letter-spacing: .02em; cursor: pointer; color: #1a1205; background: linear-gradient(#ffd27a, #e79a2c); box-shadow: 0 0 0 1px rgb(255 226 160 / .5) inset, 0 4px 14px rgb(242 181 76 / .35); }
  .abtn.ghost { color: var(--ink); background: rgb(255 255 255 / .06); box-shadow: 0 0 0 1px rgb(255 255 255 / .18) inset; }
  .abtn.full { width: 100%; }

  /* carta de mentira */
  .card { --w: 62px; width: var(--w); aspect-ratio: 63 / 88; border-radius: calc(var(--w) * .06); padding: calc(var(--w) * .05); box-sizing: border-box; flex: none;
    background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 2px 6px rgb(0 0 0 / .5), 0 0 0 1px rgb(0 0 0 / .6); display: flex; flex-direction: column; position: relative; transition: opacity .35s, transform .35s, filter .35s; }
  .card .nm { font: 700 calc(var(--w) * .095)/1.1 'Outfit', system-ui; color: #1b1b1b; background: rgb(255 255 255 / .75); border-radius: 2px; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .art { flex: 1; margin: calc(var(--w) * .04) 0; border-radius: 2px; background: radial-gradient(circle at 35% 30%, rgb(255 255 255 / .35), transparent 60%), linear-gradient(200deg, rgb(0 0 0 / .1), rgb(0 0 0 / .45)); }
  .card .tl { font: 600 calc(var(--w) * .075)/1.1 system-ui; color: #1b1b1b; background: rgb(255 255 255 / .6); border-radius: 2px; padding: 1px 3px; white-space: nowrap; overflow: hidden; }
  .card.token::after { content: 'Ficha'; position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); font: 700 9px/1 system-ui; background: rgb(0 0 0 / .6); color: #fff; padding: 2px 5px; border-radius: 3px; }
  .card.gone { opacity: 0; transform: scale(.85) translateY(-8px); filter: grayscale(1); }
  .card.dim .art { filter: saturate(.75) brightness(.9); }
  .W { --c1: #f4ecd2; --c2: #c9b98a; } .U { --c1: #9cc6ea; --c2: #3c6f9f; } .B { --c1: #8a8290; --c2: #3a3440; } .R { --c1: #f0a081; --c2: #b2432b; } .G { --c1: #a8d3a0; --c2: #3f7b45; } .C { --c1: #d6d6dc; --c2: #8b8b96; }

  /* ---- A faixa minimizada ---- */
  .strip { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; align-items: center; gap: 10px; width: 300px; padding: 8px 8px 8px 8px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(0 0 0 / .55); cursor: pointer; text-align: left; color: var(--ink); font: inherit; animation: strip-in .35s cubic-bezier(.2, .8, .2, 1); }
  .strip:hover { border-color: rgb(242 181 76 / .6); }
  .strip.mine { border-left: 3px solid var(--red); }
  .strip .card { --w: 38px; }
  .strip .txt { flex: 1; min-width: 0; display: grid; gap: 2px; line-height: 1.3; }
  .strip .txt strong { font: 600 13px/1.25 'Outfit', system-ui; color: var(--gold-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .txt span { font-size: 12px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .strip .txt small { font-size: 11px; color: var(--muted); }
  .strip .side { display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: stretch; justify-content: space-between; }
  .strip .x { width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .08); color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; }
  .strip .x:hover { background: rgb(255 255 255 / .16); color: var(--ink); }
  .strip .more { min-width: 20px; height: 20px; border-radius: 999px; background: var(--gold); color: #1a1205; font: 700 11px/20px 'Outfit', system-ui; text-align: center; padding: 0 5px; box-sizing: border-box; }
  .strip .stack { position: absolute; inset: 0; border-radius: 12px; z-index: -1; }
  .strip.many::before, .strip.many::after { content: ''; position: absolute; left: 6px; right: 6px; height: 100%; border-radius: 12px; background: rgb(9 13 24 / .75); border: 1px solid rgb(242 181 76 / .16); z-index: -1; }
  .strip.many::before { top: 5px; } .strip.many::after { top: 10px; left: 12px; right: 12px; opacity: .6; }
  .strip.bump { animation: bump .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes strip-in { from { opacity: 0; transform: translate(-16px, -50%); } }
  @keyframes bump { 40% { transform: translateY(-50%) scale(1.04); } }

  /* ---- A janela expandida ---- */
  .veil { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgb(6 9 18 / .55), rgb(6 9 18 / .9)); backdrop-filter: blur(2px); animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .win { width: min(640px, calc(100% - 32px)); display: grid; gap: 12px; animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .win h2 { margin: 0; text-align: center; font: 600 19px/1.3 'Outfit', system-ui; color: var(--gold-light); }
  .win .why { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; }
  .win .body { display: flex; gap: 22px; justify-content: center; align-items: flex-start; }
  .win .cause .card { --w: 128px; }
  .win .groups { display: grid; gap: 10px; min-width: 0; }
  .win h3 { margin: 0 0 6px; font: 600 13px/1.3 'Outfit', system-ui; color: var(--muted); letter-spacing: .02em; }
  .win .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .win .row .card { --w: 84px; }
  .win .foot { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
  .win .nav { display: flex; align-items: center; gap: 6px; font: 600 12px/1 'Outfit', system-ui; color: var(--muted); margin-right: 8px; }
  .win .nav button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: rgb(255 255 255 / .05); color: var(--ink); cursor: pointer; font-size: 15px; }
  .win .nav button:disabled { opacity: .3; cursor: default; }

  @media (max-width: 560px) {
    .mesa { height: 600px; }
    .strip { top: auto; bottom: 150px; transform: none; width: calc(100% - 32px); }
    @keyframes strip-in { from { opacity: 0; transform: translateY(10px); } }
    .action { width: auto; left: 16px; }
    .win .cause .card { --w: 76px; } .win .row { flex-wrap: nowrap; overflow-x: auto; } .win .row .card { --w: 58px; }
    .seat .card { --w: 44px; }
  }
</style>
</head>
<body>
  <div class="controls">
    <div class="grp"><span class="lbl">Simular:</span>
      <button data-sim="wrath">Wrath of God (em massa, suas)</button>
      <button data-sim="murder">Murder entre oponentes</button>
      <button data-sim="swords">Swords nas suas</button>
      <button data-sim="tokens">Pyroclasm em fichas</button>
    </div>
    <div class="grp"><span class="lbl">Comportamento:</span>
      <button data-mode="mixed" class="on">Misto (recomendado)</button>
      <button data-mode="min">Sempre minimizada</button>
      <button data-mode="max">Sempre expandida (hoje)</button>
    </div>
    <div class="grp"><button data-reset>Recomeçar</button></div>
  </div>

  <div class="mesa" id="mesa">
    <div class="tag opp"><b>Ana</b><span class="life">♥ 32</span><span>·</span><b>Bruno</b><span class="life">♥ 27</span></div>
    <div class="seat opp" id="opp"></div>
    <div class="seat me" id="me"></div>
    <div class="tag me"><b>Você</b><span class="life">♥ 35</span></div>
    <div class="hand" id="hand"></div>
    <div class="action"><strong>Turno de Ana · Fase principal</strong>Esperando Ana…<div style="height:8px"></div><button class="abtn full">Passar</button></div>
    <div id="slot"></div>
  </div>
  <p class="note" id="note"></p>

<script>
const C = (name, col, tl, extra = '') => ({ name, col, tl, extra });
const ME = [C('Llanowar Elves', 'G', 'Criatura — Elfo'), C('Serra Angel', 'W', 'Criatura — Anjo'), C('Sol Ring', 'C', 'Artefato'), C('Birds of Paradise', 'G', 'Criatura — Ave'), C('Soldado', 'W', 'Criatura — Soldado', 'token'), C('Soldado', 'W', 'Criatura — Soldado', 'token'), C('Soldado', 'W', 'Criatura — Soldado', 'token')];
const OPP = [C('Grizzly Bears', 'G', 'Criatura — Urso'), C('Phyrexian Arena', 'B', 'Encantamento'), C('Llanowar Elves', 'G', 'Criatura — Elfo'), C('Dark Ritual', 'B', 'Mágica')];
const HAND = ['R', 'U', 'G', 'W', 'B'];

const SIMS = {
  wrath: { cause: C('Wrath of God', 'W', 'Feitiço'), who: 'Ana', verb: 'destruiu 5 permanentes', groups: [['Suas', [0, 1, 3]], ['De Bruno', ['o0', 'o2']]], mine: true, mass: true },
  murder: { cause: C('Murder', 'B', 'Mágica Instantânea'), who: 'Ana', verb: 'destruiu Grizzly Bears, de Bruno', groups: [['De Bruno', ['o0']]], mine: false, mass: false },
  swords: { cause: C('Swords to Plowshares', 'W', 'Mágica Instantânea'), who: 'Ana', verb: 'exilou Serra Angel, sua', groups: [['Suas', [1]]], mine: true, mass: false },
  tokens: { cause: C('Pyroclasm', 'R', 'Feitiço'), who: 'Ana', verb: 'destruiu 3 fichas', groups: [['Suas', [4, 5, 6]]], mine: true, mass: true, tokens: true },
};

const card = (c, cls = '') => `<div class="card ${c.col} ${c.extra} ${cls}"><div class="nm">${c.name}</div><div class="art"></div><div class="tl">${c.tl}</div></div>`;
let mode = 'mixed', queue = [], view = 0, expanded = false, gone = new Set();

function drawTable() {
  document.getElementById('me').innerHTML = ME.map((c, i) => card(c, gone.has(i) ? 'gone' : '')).join('');
  document.getElementById('opp').innerHTML = OPP.map((c, i) => card(c, gone.has('o' + i) ? 'gone' : '')).join('');
  document.getElementById('hand').innerHTML = HAND.map((col, i) => `<div class="card ${col}" style="--w:58px;--r:${(i - 2) * 5}deg"><div class="nm">&nbsp;</div><div class="art"></div><div class="tl">&nbsp;</div></div>`).join('');
}
const pick = k => typeof k === 'string' ? OPP[+k.slice(1)] : ME[k];

/** Abre expandida? No misto: em massa que leva carta sua (fichas sozinhas não contam). */
function opensExpanded(n) {
  if (mode === 'max') return true;
  if (mode === 'min') return false;
  return n.mine && n.mass && !n.tokens;
}
function why(n) {
  if (mode !== 'mixed') return '';
  return opensExpanded(n) ? 'Abriu sozinha: remoção em massa das suas permanentes.' : '';
}

function render() {
  const slot = document.getElementById('slot');
  if (!queue.length) { slot.innerHTML = ''; note(); return; }
  if (expanded) {
    const n = queue[view];
    const groups = n.groups.map(([h, ks]) => `<section><h3>${h} (${ks.length})</h3><div class="row">${ks.map(k => card(pick(k), 'dim')).join('')}</div></section>`).join('');
    const nav = queue.length > 1 ? `<div class="nav"><button data-prev ${view === 0 ? 'disabled' : ''} aria-label="Anterior">‹</button>${view + 1} de ${queue.length}<button data-next ${view === queue.length - 1 ? 'disabled' : ''} aria-label="Próxima">›</button></div>` : '';
    slot.innerHTML = `<div class="veil" data-veil><div class="win" role="dialog" aria-modal="true">
      <h2>${n.cause.name} (${n.who}) ${n.verb}</h2>${why(n) ? `<div class="why">${why(n)}</div>` : ''}
      <div class="body"><div class="cause">${card(n.cause)}</div><div class="groups">${groups}</div></div>
      <div class="foot">${nav}${mode !== 'max' ? '<button class="abtn ghost" data-min>Minimizar</button>' : ''}<button class="abtn" data-ok>${queue.length > 1 && mode === 'max' ? 'OK' : queue.length > 1 ? 'OK, ver a próxima' : 'OK'}</button></div></div></div>`;
  } else {
    const n = queue[queue.length - 1];
    const more = queue.length - 1;
    slot.innerHTML = `<div class="strip ${n.mine ? 'mine' : ''} ${more ? 'many' : ''}" role="status" data-open tabindex="0" title="Ver o que saiu">
      ${card(n.cause)}
      <div class="txt"><strong>${n.cause.name} (${n.who})</strong><span>${n.verb}</span><small>${more ? `e mais ${more === 1 ? '1 remoção' : more + ' remoções'} · ` : ''}toque para ver</small></div>
      <div class="side"><button class="x" data-dismiss aria-label="Dispensar">×</button>${more ? `<span class="more">${queue.length}</span>` : ''}</div></div>`;
  }
  note();
}
function note() {
  const t = { mixed: 'Misto: só a remoção em massa que leva permanentes suas abre a janela inteira; o resto fica na faixa, que não escurece a mesa nem pede OK. A borda vermelha marca o que afeta você.',
              min: 'Sempre minimizada: toda remoção vai para a faixa; a janela só abre com um toque.',
              max: 'Como é hoje: toda remoção abre a janela e pede OK, uma depois da outra.' }[mode];
  document.getElementById('note').textContent = t + ' A faixa some com o × ou ao começar o seu próximo turno; tudo continua no histórico.';
}

function simulate(key) {
  const n = structuredClone(SIMS[key]);
  n.groups.forEach(([, ks]) => ks.forEach(k => gone.add(k)));
  drawTable();
  queue.push(n);
  if (opensExpanded(n)) { expanded = true; view = queue.length - 1; }
  else if (expanded) { /* a janela aberta só ganha mais uma na navegação */ }
  render();
  if (!expanded) { const s = document.querySelector('.strip'); if (s && queue.length > 1) { s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); } }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], [data-veil]');
  if (!t) return;
  if (t.dataset.sim) return simulate(t.dataset.sim);
  if (t.dataset.mode) { mode = t.dataset.mode; document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b === t)); if (mode === 'max' && queue.length) { expanded = true; view = 0; } render(); return; }
  if (t.hasAttribute('data-reset')) { queue = []; gone.clear(); expanded = false; view = 0; drawTable(); render(); return; }
  if (t.hasAttribute('data-dismiss')) { e.stopPropagation(); queue = []; render(); return; }
  if (t.hasAttribute('data-open')) { expanded = true; view = 0; render(); return; }
  if (t.hasAttribute('data-prev')) { view = Math.max(0, view - 1); render(); return; }
  if (t.hasAttribute('data-next')) { view = Math.min(queue.length - 1, view + 1); render(); return; }
  if (t.hasAttribute('data-min')) { expanded = false; render(); return; }
  if (t.hasAttribute('data-ok')) { queue.splice(view, 1); view = Math.min(view, queue.length - 1); if (!queue.length || mode !== 'max' && view < 0) expanded = false; if (!queue.length) expanded = false; render(); return; }
  if (t.hasAttribute('data-veil') && e.target === t && mode !== 'max') { expanded = false; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement?.dataset.open !== undefined) { expanded = true; view = 0; render(); } });

drawTable(); render();
</script>
</body>
</html>
