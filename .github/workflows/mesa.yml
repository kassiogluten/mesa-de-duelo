# Testes da mesa a cada push e pull request: os mesmos do hook de pre-commit, numa máquina limpa.
# O servidor (forge-bridge) fica de fora por enquanto: precisa do Forge compilado (~/forge e ~/.m2), que leva vários minutos.
name: Mesa

on:
  push:
    branches: [main, refactor]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
