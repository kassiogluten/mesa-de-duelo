# Deploy no Coolify (build pack "Docker Compose"): ponha domínio só nos serviços "web" e "grafana".
# Monitoramento (deploy/monitoring/README.md): Prometheus coleta a ponte e o cAdvisor; o Grafana mostra o painel.
services:
  web:
    build: .
    depends_on:
      - bridge
    expose:
      - "80"
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: forge-bridge/Dockerfile
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2g}
      # Senha da área de admin (/admin), em ADMIN_PASSWORD ou MESA_ADMIN_PASSWORD no Coolify: sem ela, a área fica desligada.
      - MESA_ADMIN_PASSWORD=${MESA_ADMIN_PASSWORD:-${ADMIN_PASSWORD:-}}
    expose:
      - "7171"
    volumes:
      - forge-data:/root/.forge
      # Relatos dos jogadores (relatos/AAAA-MM/<código>.json.gz e indice.jsonl), com retenção de 90 dias ou 1 GB.
      - feedback-data:/data
    restart: unless-stopped

  prometheus:
    build: deploy/monitoring/prometheus
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    build: deploy/monitoring/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/mesa-de-duelo.json
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # CPU, memória e rede de cada container do servidor (só leitura do Docker do host).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=disk,diskIO,percpu,sched,tcp,udp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  forge-data:
  feedback-data:
  prometheus-data:
  grafana-data:
